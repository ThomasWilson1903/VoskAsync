services:
  app:
    build: ./
    container_name: vosk
    environment:
      - VOSK_MODEL_PATH=/app/vosk-models/model
      - rabbitmq_host=rabbitmq
      - rabbitmq_username=${RABBITMQ_DEFAULT_USER:-admin}
      - rabbitmq_password=${RABBITMQ_DEFAULT_PASS:-password}
    depends_on:
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./vosk-models:/app/vosk-models/
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    hostname: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - .rabbitmq_data:/var/lib/rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER:-admin}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS:-password}
      - RABBITMQ_DEFAULT_VHOST=/
      - RABBITMQ_LOGS=-
      - RABBITMQ_SASL_LOGS=-
    deploy:
      resources:
        limits:
          memory: 2G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "check_port_connectivity" ]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

volumes:
  rabbitmq_data:
    driver_opts:
      type: local
      o: size=2G